[project]
name = "taintwall"
version = "0.0.0"
description = "Self-hosted control plane for AI agents' MCP tool calls."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
]
eval = [
    "agentdojo==0.1.35",
    "anthropic==1.13.0",
    "anyio==4.15.1",
    "httpx2==2.13.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taintwall"]

[tool.uv]
default-groups = ["dev"]
python-preference = "only-managed"
# Supply-chain cooldown: nothing newer than this resolves, including security
# patches, until the date is deliberately bumped (see DECISIONS.md D18).
exclude-newer = "2026-10-13T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["taintwall", "eval"]
strict = true

# agentdojo ships no type information (no py.typed).
[[tool.mypy.overrides]]
module = ["agentdojo", "agentdojo.*"]
ignore_missing_imports = true
